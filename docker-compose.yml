# ─────────────────────────────────────────────────────────
# Portfolio — Standalone Static Site
# http://<host>:8081
# ─────────────────────────────────────────────────────────

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-site
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge
    name: portfolio-network
